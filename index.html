<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Compliment Machine</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body class="pink">

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="nav-brand">✨ Compliment Machine</div>

    <ul class="nav-links" id="navLinks">

        <li><a href="#" class="nav-link active">Home</a></li>

        <li><a href="#" class="nav-link">Favorites</a></li>

        <li class="nav-dropdown">

            <a href="#" class="nav-link dropdown-toggle">Themes <span class="caret">▾</span></a>

            <div class="dropdown-menu">

                <button class="theme-btn pink active" data-theme="pink">
                    <span class="theme-dot"></span> Pink
                </button>

                <button class="theme-btn dark" data-theme="dark">
                    <span class="theme-dot"></span> Dark
                </button>

                <button class="theme-btn light" data-theme="light">
                    <span class="theme-dot"></span> Light
                </button>

                <button class="theme-btn purple" data-theme="purple">
                    <span class="theme-dot"></span> Purple
                </button>

                <button class="theme-btn red" data-theme="red">
                    <span class="theme-dot"></span> Red
                </button>

                <button class="theme-btn brown" data-theme="brown">
                    <span class="theme-dot"></span> Brown
                </button>

                <button class="theme-btn blue" data-theme="blue">
                    <span class="theme-dot"></span> Ocean
                </button>

                <button class="theme-btn green" data-theme="green">
                    <span class="theme-dot"></span> Nature
                </button>

            </div>

        </li>

        <li><a href="#" class="nav-link">About</a></li>

    </ul>

    <div class="nav-auth" id="navAuthContainer">
        <button class="nav-btn login-btn" id="loginBtn">Log In</button>
        <button class="nav-btn signup-btn" id="signupBtn">Sign Up</button>
    </div>

    <button class="nav-toggle" id="navToggle">☰</button>

</nav>

<!-- ================= AUTH MODAL ================= -->

<div class="auth-overlay" id="authOverlay">

    <div class="auth-modal">

        <button class="auth-close" id="authClose">×</button>

        <div class="auth-tabs">

            <button class="auth-tab active" data-tab="login">Log In</button>

            <button class="auth-tab" data-tab="signup">Sign Up</button>

        </div>

        <form class="auth-form" id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <p class="auth-error" id="loginError"></p>
            <button type="submit" class="auth-submit">Log In</button>
        </form>

        <form class="auth-form" id="signupForm" style="display:none;">

            <input type="text" id="signupName" placeholder="Full Name" required>
        
            <input type="email" id="signupEmail" placeholder="Email" required>
        
            <input type="password" id="signupPassword" placeholder="Password" required>
        
            <p class="auth-error" id="signupError"></p>
        
            <button type="submit" class="auth-submit">Sign Up</button>
        
        </form>

    </div>

</div>
    <!-- ================= MAIN CARD ================= -->

    <div class="container">

        <h1 class="title">
            ✨Compliment Machine✨
        </h1>

        <p class="subtitle">
            Click the button below and brighten your day! 💖
        </p>

        <div class="compliment-box">
            <p id="compliment" class="locked">
                🔒 no compliments for ghosts... sign up bestie! 💅
            </p>
        </div>

        <button id="btn" class="glow-button">

            💖 Give Me A Compliment!

        </button>
        <p class="auth-required-msg" id="authRequiredMsg"></p>

        <button id="audioBtn" class="audio-button">
            🔊 Listen
        </button>

    </div>

    <!-- ================= FOOTER ================= -->

    <footer>

        Made with 💕 by Diksha

    </footer>

    <script src="script.js"></script>

</body>

</html>
